global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: kafka
    static_configs:
      - targets: ["kafka:9092"]

  - job_name: trino
    static_configs:
      - targets: ["trino:8080"]
    metrics_path: /v1/info

  - job_name: minio
    static_configs:
      - targets: ["minio:9000"]
    metrics_path: /minio/v2/metrics/cluster
    bearer_token: "minioadmin"

  - job_name: lakehouse-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: airflow
    static_configs:
      - targets: ["airflow:8080"]
    metrics_path: /metrics
